<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Student Dashboard - Permission Management System</title>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .student-container {
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .form-section {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container mt-5 student-container">
        <h2 class="text-center">Student Dashboard</h2>

        <div class="text-right mb-3">
            <a href="index.html" class="btn btn-secondary">Home</a> <!-- Home Button -->
        </div>

        <div class="row">
            <div class="col-md-6 form-section">
                <!-- Send Request to Co-admin Form -->
                <h4>Send Request to Co-admin</h4>
                <form id="sendRequestForm">
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" class="form-control" id="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea class="form-control" id="message" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Request</button>
                </form>
            </div>

            <div class="col-md-6 form-section">
                <!-- Request History Table -->
                <h4>Request History</h4>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th scope="col">Subject</th>
                            <th scope="col">Status</th>
                            <th scope="col">Date</th>
                        </tr>
                    </thead>
                    <tbody id="requestHistory">
                        <!-- Example Data - Replace with dynamic data from your server -->
                        <tr>
                            <td>Gatepass Request</td>
                            <td>Approved</td>
                            <td>2024-10-01</td>
                        </tr>
                        <tr>
                            <td>Leave Application</td>
                            <td>Pending</td>
                            <td>2024-10-05</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('sendRequestForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            // Replace with actual AJAX call to send request to co-admin
            fetch('/api/send-request', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ subject, message })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message); // Show success or error message
                if (data.success) {
                    document.getElementById('sendRequestForm').reset(); // Clear the form
                }
            })
            .catch(error => console.error('Error:', error));
        });

        // Function to fetch request history (to be implemented)
        function fetchRequestHistory() {
            fetch('/api/request-history')
                .then(response => response.json())
                .then(data => {
                    const historyTable = document.getElementById('requestHistory');
                    historyTable.innerHTML = ''; // Clear existing data

                    data.forEach(request => {
                        const row = `<tr>
                            <td>${request.subject}</td>
                            <td>${request.status}</td>
                            <td>${request.date}</td>
                        </tr>`;
                        historyTable.innerHTML += row; // Append new data
                    });
                })
                .catch(error => console.error('Error fetching history:', error));
        }

        // Call fetchRequestHistory on page load to populate history
        document.addEventListener('DOMContentLoaded', fetchRequestHistory);
    </script>
</body>
</html>
